name: Build JCS Logistics

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # Note: If you are using Cloudflare Pages, you do NOT need to add a 
      # "Deploy" step here. Cloudflare will automatically detect this successful 
      # build and deploy it.